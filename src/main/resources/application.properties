spring.application.name=Cronoclase Grupo 5

spring.config.import=optional:file:.env[.properties]

# ─── PostgreSQL Database Configuration ────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Swagger / OpenAPI (Springdoc) ────────────────────────────────────────────
# JSON de la coleccion: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
# UI de Swagger (opcional): http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ─── Scalar ───────────────────────────────────────────────────────────────────
# Scalar lee el JSON de OpenAPI generado por Springdoc (local)
# Documentacion interactiva disponible en: http://localhost:8080/docs
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/docs
scalar.theme=deepSpace
